title: Suspicious LSASS Process Access for Credential Dumping
id: 2e8b4d1a-9c7f-4b3e-8a2d-1f5e6c7d8b9a
status: experimental
description: Detects processes opening a handle to lsass.exe with access rights consistent with credential dumping tools such as Mimikatz or ProcDump.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/
author: Emanuel Walker
date: 2026/09/15
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection_target:
    winlog.event_data.TargetImage|endswith: '\lsass.exe'
  selection_access:
    winlog.event_data.GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_legit_tools:
    winlog.event_data.SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\MsSense.exe'
      - '\CSFalconService.exe'
      - '\SentinelAgent.exe'
      - '\wsmprovhost.exe'
  condition: selection_target and selection_access and not filter_legit_tools
fields:
  - winlog.event_data.SourceImage
  - winlog.event_data.TargetImage
  - winlog.event_data.GrantedAccess
  - winlog.event_data.SourceProcessId
  - host.name
  - user.name
falsepositives:
  - Endpoint protection agents (Defender, Defender for Endpoint, CrowdStrike Falcon, SentinelOne) reading LSASS memory for scanning. Filtered by SourceImage.
  - Legitimate memory forensics tooling during incident response. Coordinate suppression with the IR lead.
level: critical
